name: UniDB end-to-end tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Node client against real UniDB server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Node.js client
        uses: actions/checkout@v4

      - name: Check out UniDB server
        uses: actions/checkout@v4
        with:
          repository: soujash-mandal/UniDB
          ref: main
          path: unidb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UniDB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake g++ libgtest-dev

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build UniDB server
        run: |
          cmake -S unidb -B unidb/build -DCMAKE_BUILD_TYPE=Release
          cmake --build unidb/build --target unidb --parallel 2

      - name: Start UniDB server
        run: |
          unidb/build/unidb start \
            --db-path "$RUNNER_TEMP/unidb-node-e2e.db" \
            --port 17432

      - name: Run end-to-end tests
        env:
          UNIDB_HOST: 127.0.0.1
          UNIDB_PORT: 17432
        run: npm run test:e2e

      - name: Stop UniDB server
        if: always()
        run: |
          if [ -x unidb/build/unidb ]; then
            unidb/build/unidb stop \
              --db-path "$RUNNER_TEMP/unidb-node-e2e.db" \
              --port 17432 || true
          fi

          if [ -f "$RUNNER_TEMP/unidb-node-e2e.db.log" ]; then
            cat "$RUNNER_TEMP/unidb-node-e2e.db.log"
          fi
